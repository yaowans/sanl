        async function loadThreshold() {
            try {
                const d = await (await fetch(`${API}/settings/check-threshold`)).json();
                const inp = document.getElementById('ck-threshold');
                if (inp) inp.value = d.qualified_latency_ms;
            } catch(e) {}
        }
        async function saveThreshold(btn) {
            const v = parseInt(document.getElementById('ck-threshold').value, 10);
            if (!(v >= 50 && v <= 5000)) { showToast('请输入 50~5000 之间的毫秒值','error'); return; }
            btn.disabled = true; btn.textContent = '⏳ 处理中…';
            try {
                await (await fetch(`${API}/settings/check-threshold?value=${v}`, { method:'POST' })).json();
                const r = await (await fetch(`${API}/admin/apply-qualified-latency`, { method:'POST' })).json();
                showToast(`✅ 已保存 ${v}ms，重判完成：${r.marked_inactive} 个超时节点标记为不可用`, 'success');
                const hint = document.getElementById('ck-threshold-hint');
                if (hint) hint.textContent = `当前阈值 ${r.threshold_ms}ms`;
            } catch(e) { showToast('保存失败','error'); }
            btn.disabled = false; btn.textContent = '💾 保存并立即重判';
        }

        let _ckTimer = null;

        async function pollCheckProgress() {
            if (_ckTimer) { clearTimeout(_ckTimer); _ckTimer = null; }
            if (currentPage !== 'check') return;
            try {
                const d = await (await fetch(`${API}/check/progress`)).json();
                renderProgress(d);
                // running 时 2s 快轮询，否则 6s 慢轮询（页面保持时）
                _ckTimer = setTimeout(pollCheckProgress, d.status === 'running' ? 2000 : 6000);
            } catch(e) { _ckTimer = setTimeout(pollCheckProgress, 8000); }
        }

        function renderProgress(d) {
            const box = document.getElementById('ck-progress');
            if (!box || currentPage !== 'check') return;
            if (d.status === 'idle' || (!d.job_id && d.status !== 'running')) { box.innerHTML = ''; return; }

            const running = d.status === 'running';
            const srcBadge = d.source === 'manual'
                ? '<span class="badge badge-info">🧑‍💻 前台 · 手动触发</span>'
                : '<span class="badge badge-secondary">⏰ 后台 · 定时调度</span>';
            const MODE_NAMES = { latency:'🚀 仅延迟', speed:'⚡ 延迟+速度', full:'🔬 全量' };
            const modeBadge = d.mode ? `<span class="badge badge-info">${MODE_NAMES[d.mode] || escHtml(d.mode)}</span>` : '';
            const stBadge = running
                ? '<span class="badge badge-warning"><span class="loading" style="width:12px;height:12px;border-width:2px;"></span> 运行中</span>'
                : d.status === 'completed' ? '<span class="badge badge-success">✅ 已完成</span>'
                : d.status === 'failed' ? '<span class="badge badge-danger">❌ 失败</span>' : `<span class="badge badge-secondary">${d.status}</span>`;
            const dur = d.elapsed != null ? `${Math.floor(d.elapsed/60)}分${Math.round(d.elapsed%60)}秒` : '--';

            // 步骤条
            const steps = (d.phases || []).map((name, i) => {
                let cls = '', icon = '⬜';
                if (d.phase_idx == null) {
                    // 后端 DB 兜底路径没有阶段信息：已完成则整条打勾，运行中则全部待定
                    if (d.status === 'completed') { cls = 'done'; icon = '✅'; }
                    else if (!running && d.status === 'failed') { cls = 'done'; icon = '❌'; }
                }
                else if (i < d.phase_idx || (!running && d.phase_idx >= i && d.status === 'completed')) { cls = 'done'; icon = '✅'; }
                else if (i === d.phase_idx) { cls = running ? 'active' : 'active'; icon = running ? '🔄' : '⏸'; }
                return `<div style="flex:1;text-align:center;">
                    <div style="font-size:22px;margin-bottom:4px;">${icon}</div>
                    <div style="font-size:12px;color:${cls==='active'&&running?'var(--primary)':'var(--text-muted)'};font-weight:${cls==='active'?600:400};">${name}</div>
                    ${i < (d.phases||[]).length-1 ? '' : ''}
                </div>`;
            }).join('<div style="width:24px;border-top:2px dashed var(--border);align-self:flex-start;margin-top:16px;"></div>');

            const num = (v, label, accent) => `
                <div style="flex:1;background:var(--surface-2);border-radius:10px;padding:12px;text-align:center;">
                    <div style="font-size:22px;font-weight:700;color:${accent};">${v ?? '--'}</div>
                    <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${label}</div>
                </div>`;
            const alivePct = (d.nodes_alive != null && d.nodes_deduped) ? Math.round(d.nodes_alive / d.nodes_deduped * 100) : null;
            const bar = alivePct != null ? `
                <div style="background:var(--surface-2);border-radius:99px;height:8px;overflow:hidden;margin:14px 0 4px;">
                    <div style="width:${alivePct}%;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .5s ease;"></div>
                </div>
                <div class="text-muted" style="font-size:11px;">存活率 ${alivePct}%（存活/去重后）</div>` : '';

            const logLines = (d.log || []).slice(-40).map(l => escHtml(l)).join('\n');
            box.innerHTML = `
                <div class="chart-container">
                    <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <div class="flex">${srcBadge}${modeBadge}${stBadge}<span class="badge badge-secondary">⏱ ${dur}</span>${d.traffic?`<span class="badge badge-secondary">📶 流量 ${escHtml(d.traffic)}</span>`:''}</div>
                        <span class="text-muted" style="font-size:12px;">任务 #${d.job_id ?? '--'}${d.error_message?` · <span style="color:var(--danger)">${escHtml(String(d.error_message).slice(0,60))}</span>`:''}</span>
                    </div>
                    <div style="display:flex;gap:6px;margin-bottom:14px;">${steps}</div>
                    <div style="display:flex;gap:10px;">
                        ${num(d.nodes_found,'📥 获取节点','#2563eb')}
                        ${num(d.nodes_deduped,'🧹 去重后','#d97706')}
                        ${num(d.nodes_alive,'❤️ 存活节点','#16a34a')}
                    </div>
                    ${bar}
                    ${logLines ? `<pre id="ck-log" style="background:#0f172a;color:#7dd3fc;border-radius:12px;padding:14px;max-height:220px;overflow-y:auto;font-family:monospace;font-size:12px;line-height:1.55;margin:14px 0 0;white-space:pre-wrap;word-break:break-all;">${logLines}</pre>`:''}
                </div>`;
            // 日志自动滚到底
            const lg = document.getElementById('ck-log');
            if (lg) lg.scrollTop = lg.scrollHeight;
            // 按钮态
            const fg = document.getElementById('ck-btn-fg'), bg = document.getElementById('ck-btn-bg');
            if (fg && bg) { fg.disabled = running; fg.title = running ? '已有测速在运行' : ''; }
        }

        async function loadCheckHistory() {
            try {
                const jobs = await (await fetch(`${API}/check/history?limit=20`)).json();
                const tbody = document.getElementById('check-tbody');
                if (!tbody || currentPage !== 'check') return;  // 页面已切换，放弃本次渲染
                if (!jobs.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无任务记录</td></tr>'; return; }
                tbody.innerHTML = jobs.map(j => {
                    const st = j.started_at ? new Date(j.started_at*1000).toLocaleString() : '--';
                    const dur = j.started_at && j.finished_at ? Math.round(j.finished_at - j.started_at)+'s' : '--';
                    const badge = j.status === 'completed' ? 'badge-success' : j.status === 'failed' ? 'badge-danger' : 'badge-warning';
                    return `<tr><td>#${j.id}</td><td>${j.job_type}</td>
                        <td><span class="badge ${badge}">${j.status}</span></td>
                        <td>${st}</td><td>${dur}</td>
                        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;font-size:12px;">${j.error_message || j.result || '-'}</td></tr>`;
                }).join('');

        }

        async function runCheck(trigger = 'manual') {
            const label = trigger === 'manual' ? '前台' : '后台';
            // 收集高级参数覆盖（留空不传）
            const ov = {};
            const map = {'ov-concurrent':'concurrent','ov-timeout':'timeout','ov-min-speed':'min-speed',
                         'ov-download-mb':'download-mb','ov-download-timeout':'download-timeout',
                         'ov-speed-concurrent':'speed-concurrent','ov-max-sources':'max_sources'};
            for (const [elId, key] of Object.entries(map)) {
                const el = document.getElementById(elId);
                if (el && el.value !== '' && el.value != null) ov[key] = isNaN(Number(el.value)) ? el.value : Number(el.value);
            }
            // 测速范围
            ov.scope = ckScope;
            const scopeName = CHECK_SCOPES.find(s=>s.id===ckScope)?.name || '全部节点';
            try {
                const qs = new URLSearchParams({ trigger, mode: ckMode });
                const body = Object.keys(ov).length ? JSON.stringify(ov) : undefined;
                const r = await (await fetch(`${API}/check/run?${qs}`, {
                    method:'POST', body,
                    headers: body ? {'Content-Type':'application/json'} : {}
                })).json();
                if (r.status === 'already_running') {
                    showToast(`已有${r.source==='manual'?'前台':'后台'}测速正在运行（任务 #${r.job_id}）`, 'error');

        }

        async function gfwLoadHealth() {
            const st = document.getElementById('gfw-probe-state');

            try {
                const d = await (await fetch(`${API}/gfw/health`)).json();
                if (!d.enabled) {
                    st.textContent = '未启用'; st.style.color = '#94a3b8';
                    ip.textContent = '—';
                    document.getElementById('gfw-msg').innerHTML =
                        '探针未启用。请到 <a href="#" onclick="goPage(\'gfwconfig\');return false;" style="color:var(--primary);">GFW 配置</a> 页填写探针地址与密钥，并打开「启用 GFW 检测」开关。'

                    return;

                if (d.ok) {
                    st.textContent = '正常'; st.style.color = '#16a34a';
                    ip.textContent = d.egress_ip || '—';
                    const cn = /^(\d+\.){3}\d+$/.test(d.egress_ip || '');

                        : '⚠️ 探针在线，但出口 IP 不像境内地址，检测结果可能无法反映 GFW 拦截情况。';
                } else {
                    st.textContent = '异常'; st.style.color = '#dc2626';
                    ip.textContent = '—';
                    document.getElementById('gfw-msg').textContent = '探针异常: ' + (d.error || '未知错误');

        async function gfwCfgReload() {
            const box = document.getElementById('gfw-cfg-form');
            try {
                const d = await (await fetch(`${API}/gfw/config`)).json();
                _gfwCfgItems = d.items || [];
                gfwCfgRenderForm();
            } catch (e) {
                if (box) box.innerHTML = '<div style="color:#dc2626;font-size:13px;">配置加载失败: ' + escHtml(e.message) + '</div>';
            }
        }

        function gfwCfgRenderForm() {
            const box = document.getElementById('gfw-cfg-form');
            if (!box) return;
            const SRC_LABEL = { db: '本页保存', env: '环境变量', yaml: 'app.yaml', default: '默认值' };
            box.innerHTML = _gfwCfgItems.map(f => {
                const src = SRC_LABEL[f.source] || f.source;
                const badge = f.source === 'db'
                    ? '<span class="badge badge-info" style="margin-left:6px;">已覆盖</span>'
                    : `<span class="badge badge-secondary" style="margin-left:6px;" title="当前值来自 ${escHtml(src)}">${escHtml(src)}</span>`;
                let control;
                if (f.type === 'bool') {
                    control = `<label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;">
                        <input type="checkbox" data-gfw-key="${escHtml(f.key)}" data-gfw-type="bool" ${f.value ? 'checked' : ''}>
                        <span style="font-size:13px;">${f.value ? '已开启' : '已关闭'}</span></label>`;
                } else if (f.type === 'number') {
                    control = `<input type="number" class="form-input" style="width:160px;"
                        data-gfw-key="${escHtml(f.key)}" data-gfw-type="number"
                        value="${f.value ?? ''}" min="${f.min ?? ''}" max="${f.max ?? ''}" step="${f.step ?? 1}">`;
                } else if (f.type === 'password') {
                    control = `<input type="password" class="form-input" style="width:100%;max-width:420px;"
                        data-gfw-key="${escHtml(f.key)}" data-gfw-type="password"
                        value="" placeholder="${escHtml(f.placeholder || (f.value || ''))}"
                        autocomplete="new-password">`;
                } else {
                    control = `<input type="text" class="form-input" style="width:100%;max-width:420px;"
                        data-gfw-key="${escHtml(f.key)}" data-gfw-type="text"
                        value="${escHtml(f.value ?? '')}" placeholder="${escHtml(f.placeholder || '')}">`;
                }
                return `
                <div>
                    <div style="font-size:13px;font-weight:600;margin-bottom:6px;">${escHtml(f.label)}${badge}</div>
                    ${control}
                    <div style="font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.6;">${escHtml(f.help || '')}</div>
                </div>`;
            }).join('');
            // 开关的 on/off 文案联动
            box.querySelectorAll('input[data-gfw-type="bool"]').forEach(cb => {
                cb.addEventListener('change', () => {
                    const span = cb.parentElement.querySelector('span');
                    if (span) span.textContent = cb.checked ? '已开启' : '已关闭';
                });
            });
        }

        function gfwCfgCollect() {
            const values = {};
            document.querySelectorAll('#gfw-cfg-form [data-gfw-key]').forEach(el => {
                const key = el.dataset.gfwKey, type = el.dataset.gfwType;
                if (type === 'bool') { values[key] = el.checked; return; }
                if (type === 'password') {
                    // 密码框留空 = 不改（后端脱敏回显，提交空串会清掉覆盖）
                    if (el.value.trim()) values[key] = el.value.trim();
                    return;
                }
                if (type === 'number') {
                    const n = parseFloat(el.value);
                    if (!isNaN(n)) values[key] = n;
                    return;
                }
                values[key] = el.value.trim();
            });
            return values;
        }

        async function gfwCfgSave(btn) {
            const values = gfwCfgCollect();
            const msg = document.getElementById('gfw-cfg-msg');
            btn.disabled = true; btn.textContent = '⏳ 保存中…';
            try {
                const d = await (await fetch(`${API}/gfw/config`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({values})
                })).json();
                if (d.detail) { msg.innerHTML = '<span style="color:#dc2626;">保存失败: ' + escHtml(d.detail) + '</span>'; return; }
                _gfwCfgItems = d.items || [];
                gfwCfgRenderForm();
                msg.innerHTML = '<span style="color:#16a34a;">✅ 配置已保存并立即生效。</span>';
            } catch (e) {
                msg.innerHTML = '<span style="color:#dc2626;">保存失败: ' + escHtml(e.message) + '</span>';
            }
            btn.disabled = false; btn.textContent = '💾 保存配置';
        }

        async function gfwCfgTest(btn) {
            const values = gfwCfgCollect();
            const msg = document.getElementById('gfw-cfg-msg');
            btn.disabled = true; btn.textContent = '⏳ 测试中…';
            try {
                const d = await (await fetch(`${API}/gfw/config/test`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({values})
                })).json();
                if (d.detail) { msg.innerHTML = '<span style="color:#dc2626;">测试失败: ' + escHtml(d.detail) + '</span>'; return; }
                if (!d.ok) { msg.innerHTML = '<span style="color:#dc2626;">❌ 探针不可用: ' + escHtml(d.error || '未知错误') + '</span>'; return; }
                const ip = d.egress_ip || '—';
                const cn = /^(\d+\.){3}\d+$/.test(ip);
                msg.innerHTML = `✅ 探针连通正常，鉴权通过。出口 IP：<b>${escHtml(ip)}</b>`
                    + (cn ? '（看起来是境内地址，具备 GFW 判别力）' : '（⚠️ 不像境内地址，检测结果可能无法反映 GFW 拦截）');
            } catch (e) {
                msg.innerHTML = '<span style="color:#dc2626;">测试失败: ' + escHtml(e.message) + '</span>';
            }
            btn.disabled = false; btn.textContent = '🔌 测试连接';
        }

        let _gfwProbeScript = '';
        async function gfwCfgLoadProbeScript() {
            try {
                const d = await (await fetch(`${API}/gfw/config/probe-script`)).json();
                if (d.detail) { showToast('获取失败: ' + d.detail, 'error'); return; }
                _gfwProbeScript = d.content || '';
                document.getElementById('gfw-cfg-script-text').value = _gfwProbeScript;
                document.getElementById('gfw-cfg-usage').textContent = (d.usage || []).join('\n');
                document.getElementById('gfw-cfg-script').style.display = 'block';
            } catch (e) { showToast('获取失败: ' + e.message, 'error'); }
        }
        function gfwCfgCopyProbeScript() {
            if (!_gfwProbeScript) { gfwCfgLoadProbeScript(); return; }
            const ta = document.createElement('textarea');
            ta.value = _gfwProbeScript;
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showToast('✅ 脚本已复制'); } catch(e) { showToast('复制失败，请手动选择', 'error'); }
            document.body.removeChild(ta);
        }
        function gfwCfgDownloadProbeScript() {
            if (!_gfwProbeScript) { gfwCfgLoadProbeScript(); return; }
            const blob = new Blob([_gfwProbeScript], {type: 'text/x-python'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = 'cn_probe.py'; a.click(); URL.revokeObjectURL(a.href);
            showToast('✅ 已下载 cn_probe.py');
        }

        function downloadConvert() {
            const c = window._cvContent || '';

        async function doLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value;
            const err = document.getElementById('login-err');
            const btn = document.getElementById('login-btn');
            if (!u || !p) { err.textContent = '请输入用户名和密码'; return; }
            btn.disabled = true; btn.textContent = '登录中…';
            try {
                const r = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) {
                    err.textContent = d.detail || `登录失败 (HTTP ${r.status})`;
                    btn.disabled = false; btn.textContent = '登录';
                    return;
                }
                _authUser = d.user;
                _authChecked = true;
                document.getElementById('login-pass').value = '';
                hideLoginOverlay();
                showToast('✅ 登录成功');
                renderPage(currentPage);
            } catch (e) {
                err.textContent = '网络错误: ' + e.message;
                btn.disabled = false; btn.textContent = '登录';
            }
        }

            // 「最近检查」：取最近一次已完成的测速任务时间（原始终显示 "--"）
            try {
                const h = await (await fetch(`${API}/check/history?limit=20`)).json();
                const done = (Array.isArray(h) ? h : []).find(j => j.status === 'completed' && j.finished_at);
                const el = document.getElementById('last-check');
                if (el) {
                    el.textContent = done
                        ? `最近检查: ${new Date((done.finished_at || 0) * 1000).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'月').replace(/\s/g,' ')}`
                        : '最近检查: --';
                }
            } catch(e) {}
        }
        refreshSidebarStats();
        setInterval(refreshSidebarStats, 10000);  // 刷新提速：30s→10s    </script>

<!-- 全局任务进度条（抓取/测速等后台任务实时视图） -->
<div id="global-tasks" style="position:fixed;top:0;left:0;right:0;z-index:9999;pointer-events:none;"></div>
<script>
// ===== 全局任务进度轮询 =====
let _gtShown = new Set();   // 已通知过的完成任务 id
let _gtTimer = null;
async function pollGlobalTasks() {
    if (!_authUser) { _gtTimer = setTimeout(pollGlobalTasks, 10000); return; }
    let hasActive = false;
    try {
        const d = await (await fetch(`${API}/tasks`)).json();
        const box = document.getElementById('global-tasks');
        const act = d.active || [];
        if (!act.length) {
            // 无活动任务：展示 5 秒内刚完成的，随后隐藏
            const recent = (d.recent || []).filter(t => t.elapsed < 8 && !_gtShown.has(t.id));
            if (!recent.length) { box.innerHTML = ''; return; }
            box.innerHTML = recent.map(t => `
                <div style="pointer-events:auto;margin:6px auto;max-width:520px;background:var(--card,#fff);border:1px solid var(--bd,#e2e8f0);border-radius:10px;padding:8px 14px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:13px;">
                    ✅ ${t.name} 完成 · 耗时 ${t.elapsed}s
                </div>`).join('');
            recent.forEach(t => _gtShown.add(t.id));
            setTimeout(() => { box.innerHTML = ''; }, 5000);
            return;
        }
        box.innerHTML = act.map(t => {
            const pct = t.pct >= 0 ? t.pct : null;
            const bar = pct != null
                ? `<div style="height:7px;background:var(--bd,#e2e8f0);border-radius:4px;overflow:hidden;margin-top:6px;">
                     <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:4px;transition:width .6s ease;"></div>
                   </div><div style="text-align:right;font-size:11px;color:var(--mut,#64748b);margin-top:2px;">${t.done}/${t.total} · ${pct}% · ${t.elapsed}s</div>`
                : `<div style="margin-top:6px;height:7px;border-radius:4px;background:repeating-linear-gradient(90deg,#2563eb 0 14px,#93c5fd 14px 28px);background-size:56px 100%;animation:gtslide 1.1s linear infinite;"></div>
                   <div style="text-align:right;font-size:11px;color:var(--mut,#64748b);margin-top:2px;">${t.detail || '进行中'} · ${t.elapsed}s</div>`;
            return `<div style="pointer-events:auto;margin:6px auto;max-width:520px;background:var(--card,#fff);border:1px solid var(--bd,#e2e8f0);border-radius:10px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:13px;font-weight:600;">
                      ${t.name}${t.detail && pct != null ? ` <span style="font-weight:400;color:var(--mut,#64748b);font-size:12px;">· ${t.detail}</span>` : ''}${bar}
                    </div>`;
        }).join('');
    } catch(e) {}
    finally {
        clearTimeout(_gtTimer);
        _gtTimer = setTimeout(pollGlobalTasks, hasActive ? 2500 : 10000);
    }
}
if (!document.getElementById('gtslide-style')) {
    const st = document.createElement('style'); st.id = 'gtslide-style';

}

// E4：后端缓存命中率浮标（验证「多命中缓存」效果）
(function () {
    const b = document.createElement('button');
    b.textContent = '⚡缓存';
    b.style.cssText = 'position:fixed;right:14px;bottom:70px;z-index:999;padding:8px 12px;border-radius:20px;border:1px solid var(--bd,#e2e8f0);background:var(--card,#fff);color:var(--text,#0f172a);font-size:12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12);';
    b.onclick = async () => {
        try {
            const d = await (await fetch(`${API}/cache/status`)).json();
            const hit = d.hit || 0, miss = d.miss || 0;
            const rate = (hit + miss) ? Math.round(hit / (hit + miss) * 100) : 0;
            const m = document.createElement('div'); m.className = 'modal'; m.style.display = 'flex';
            m.innerHTML = `<div class="modal-content" style="max-width:420px;">
                <div class="modal-header"><h2 class="modal-title">⚡ 后端缓存命中率</h2>
                    <button class="modal-close" style="background:none;border:0;font-size:24px;color:var(--text-muted,#64748b);cursor:pointer;">&times;</button></div>
                <p style="font-size:13px;color:var(--text-muted,#64748b);">用于验证「多命中缓存、不命中缓存」目标：读多写少接口已加 3~5s TTL，缓解高频轮询打 SQLite 的成本。</p>
                <div style="margin:16px 0;"><b>命中率</b> <span style="font-size:24px;font-weight:700;color:#2563eb;">${rate}%</span></div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;">
                    <div style="background:var(--card,#fff);border:1px solid var(--bd,#e2e8f0);border-radius:10px;padding:12px;"><div style="font-size:22px;font-weight:700;">${hit}</div><div style="font-size:11px;color:var(--text-muted,#64748b);">命中</div></div>
                    <div style="background:var(--card,#fff);border:1px solid var(--bd,#e2e8f0);border-radius:10px;padding:12px;"><div style="font-size:22px;font-weight:700;">${miss}</div><div style="font-size:11px;color:var(--text-muted,#64748b);">未命中</div></div>
                    <div style="background:var(--card,#fff);border:1px solid var(--bd,#e2e8f0);border-radius:10px;padding:12px;"><div style="font-size:22px;font-weight:700;">${d.size || 0}</div><div style="font-size:11px;color:var(--text-muted,#64748b);">缓存条目</div></div>
                </div>
                <div style="margin-top:16px;text-align:right;"><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">关闭</button></div></div>`;
            m.onclick = e => { if (e.target === m) m.remove(); };
            m.querySelector('.modal-close').onclick = () => m.remove();
            document.body.appendChild(m);
        } catch (e) { alert('缓存状态获取失败: ' + e.message); }
    };
    document.body.appendChild(b);
})();

let _cwScript = '', _cwConfigLink = '';

async function generateWorker() {
    const nodeCount = parseInt(document.getElementById('cw-nodes').value) || 20;
    const userId = document.getElementById('cw-uuid').value.trim();
    const proxyIp = document.getElementById('cw-proxy-ip').value.trim();
    const maxCh = parseInt(document.getElementById('cw-channels').value) || 100;
    try {
        const r = await fetch('/api/edgetunnel/generate', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({node_count: nodeCount, user_id: userId || null,
                                   proxy_ip: proxyIp, max_channels: maxCh, include_nodes: true}),
        });
        const d = await r.json();
        if (!d.ok) { showToast('生成失败: ' + (d.error || 'unknown'), 'error'); return; }
        _cwScript = d.script; _cwConfigLink = d.config_link;
        document.getElementById('cw-script').value = d.script;
        document.getElementById('cw-config-link').value = d.config_link;
        document.getElementById('cw-result').style.display = 'block';
        document.getElementById('cw-config').style.display = 'block';
        if (d.nodes && d.nodes.length > 0) {
            document.getElementById('cw-nodes-table').innerHTML = '<table style="width:100%;font-size:13px;"><thead><tr><th style="text-align:left;">名称</th><th>协议</th><th>服务器</th><th>延迟</th><th>国家</th></tr></thead><tbody>'
                + d.nodes.map(n => '<tr><td>' + escHtml(n.name || '') + '</td><td>' + escHtml(n.type || '')
                + '</td><td style="font-family:monospace;font-size:11px;">' + escHtml(n.server || '') + ':' + n.port + '</td>'
                + '<td>' + (n.latency ? n.latency + 'ms' : '-') + '</td><td>' + escHtml(n.country || '') + '</td></tr>').join('')
                + '</tbody></table>';
            document.getElementById('cw-nodes-list').style.display = 'block';
        } else { document.getElementById('cw-nodes-list').style.display = 'none'; }
        showToast('✅ Worker 脚本已生成（' + d.node_count + ' 个参考节点）');
    } catch (e) { showToast('请求失败: ' + e.message, 'error'); }
}

async function loadExample() {
    try {
        const r = await fetch('/api/edgetunnel/config-example');
        const d = await r.json();
        _cwScript = d.script; _cwConfigLink = d.config_link;
        document.getElementById('cw-script').value = d.script;
        document.getElementById('cw-config-link').value = d.config_link;
        document.getElementById('cw-result').style.display = 'block';
        document.getElementById('cw-config').style.display = 'block';
        document.getElementById('cw-nodes-list').style.display = 'none';
        showToast('✅ 示例已加载');
    } catch (e) { showToast('加载失败: ' + e.message, 'error'); }
}

function copyWorkerScript() {
    const el = document.getElementById('cw-script'); el.select();
    navigator.clipboard.writeText(el.value).then(() => showToast('脚本已复制')).catch(() => showToast('复制失败', 'error'));
}
function downloadWorkerScript() {
    const blob = new Blob([_cwScript], {type: 'text/javascript'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'worker.js'; a.click(); URL.revokeObjectURL(a.href);
    showToast('✅ 已下载 worker.js');
}
function copyConfigLink() {
    const el = document.getElementById('cw-config-link'); el.select();
    navigator.clipboard.writeText(el.value).then(() => showToast('链接已复制')).catch(() => showToast('复制失败', 'error'));
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
