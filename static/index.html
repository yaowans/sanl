<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sanl - 节点池聚合平台</title>
    <!-- PWA：安卓 Chrome/Edge 可「安装应用」到桌面，全屏独立运行 -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/png" href="/static/icons/favicon.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sanl">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () =>
                navigator.serviceWorker.register('/sw.js').catch(err =>
                    console.warn('SW register failed:', err)));
        }
    </script>
    <script src="/vendor/echarts.min.js?v=5.4.3"></script>
    <script src="/vendor/qrcode.min.js?v=1.0.0" defer></script>
    <style>
        :root {
            --bg: #f0f4fa; --surface: #ffffff; --surface-2: #f8fafc;
            --border: #e2e8f0; --text: #1e293b; --text-muted: #64748b;
            --primary: #2563eb; --primary-hover: #1d4ed8; --accent: #0ea5e9;
            --success: #16a34a; --warning: #d97706; --danger: #dc2626;
            --shadow: 0 1px 3px rgba(30,64,175,.08), 0 4px 16px rgba(30,64,175,.07);
            --shadow-lg: 0 4px 8px rgba(30,64,175,.10), 0 12px 32px rgba(30,64,175,.12);
            --hover: #eff6ff; --code-bg: #f1f5f9;
        }
        [data-theme="dark"] {
            --bg: #0b1220; --surface: #151f31; --surface-2: #1c2a40;
            --border: #2a3a55; --text: #e2e8f0; --text-muted: #8fa3bd;
            --primary: #60a5fa; --primary-hover: #93c5fd; --accent: #38bdf8;
            --success: #34d399; --warning: #fbbf24; --danger: #f87171;
            --shadow: 0 1px 3px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.3);
            --shadow-lg: 0 4px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
            --hover: #1e2d47; --code-bg: #0f1a2c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: auto; }
        .container { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 20px; flex-shrink: 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
        .main { flex: 1; padding: 30px; overflow-y: auto; min-width: 0; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--text-muted); font-size: 14px; font-weight: normal; }
        .nav-item { padding: 12px 16px; border-radius: 10px; cursor: pointer; transition: all .2s ease; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-weight: 500; }
        .nav-item:hover { background: var(--hover); color: var(--primary); }
        .nav-item.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,.30); }
        .sidebar-footer { margin-top: auto; padding-top: 20px; color: #94a3b8; font-size: 12px; }
        .nav-group { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: .8px; padding: 14px 16px 6px; font-weight: 700; }
        .nav-group:first-child { padding-top: 2px; }
        .module-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; padding:6px; background:var(--surface); border:1px solid var(--border); border-radius:14px; position:sticky; top:calc(10px + env(safe-area-inset-top,0px)); z-index:50; backdrop-filter:blur(10px); }
        .mtab { border:none; background:transparent; color:var(--text-muted); font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:10px; cursor:pointer; transition:all .18s ease; display:inline-flex; align-items:center; gap:6px; font-family:inherit; }
        .mtab:hover { color:var(--primary); background:var(--hover); }
        .mtab.active { background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; box-shadow:0 3px 10px rgba(37,99,235,.28); }
        @media (max-width:768px){ .module-tabs{ top:calc(64px + env(safe-area-inset-top,0px)); overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none; } .module-tabs::-webkit-scrollbar{display:none;} .mtab{white-space:nowrap;} }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--surface); padding: 24px; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); transition: transform .2s ease, box-shadow .2s ease; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .stat-value { font-size: 36px; font-weight: bold; color: var(--primary); }
        .stat-label { color: var(--text-muted); margin-top: 8px; }
        .table-container { background: var(--surface); border-radius: 14px; overflow-x: auto; overflow-y: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .table-container table { min-width: 640px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: var(--surface-2); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: .4px; white-space: nowrap; }
        tbody tr { transition: background .15s ease; }
        tbody tr:hover { background: var(--hover); }
        tbody tr:last-child td { border-bottom: none; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; white-space: nowrap; display: inline-block; }
        .badge-success { background: #dcfce7; color: var(--success); }
        .badge-warning { background: #fef3c7; color: var(--warning); }
        .badge-danger { background: #fee2e2; color: var(--danger); }
        .badge-info { background: #dbeafe; color: var(--primary); }
        .badge-secondary { background: #f1f5f9; color: var(--text-muted); }
        .btn { padding: 10px 20px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; font-size: 14px; transition: all .2s ease; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; text-decoration: none; }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.25); }
        .btn-primary:hover { box-shadow: 0 4px 16px rgba(37,99,235,.40); }
        .btn-secondary { background: var(--surface); color: var(--primary); border-color: var(--border); }
        .btn-secondary:hover { background: var(--hover); border-color: var(--primary); }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        .btn-danger:hover { background: #fecaca; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 14px; }
        .form-input { width: 100%; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; transition: border-color .2s, box-shadow .2s; }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        select.form-input { cursor: pointer; }
        textarea.form-input { min-height: 100px; font-family: monospace; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,.45); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--surface); border-radius: 18px; padding: 30px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: popIn .22s ease; }
        @keyframes popIn { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: bold; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .chart-container { background: var(--surface); border-radius: 14px; padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 20px; animation: fadeUp .3s ease both; }
        .chart { height: 300px; }
        .chart-tall { height: 500px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; animation: fadeUp .3s ease both; }
        .page-title { font-size: 28px; font-weight: bold; margin-bottom: 0; background: linear-gradient(120deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .table-container { animation: fadeUp .3s ease both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #dbeafe; border-radius: 50%; border-top-color: var(--primary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); right: calc(20px + env(safe-area-inset-right, 0px)); padding: 12px 24px; border-radius: 12px; color: white; z-index: 2000; animation: slideIn .3s; box-shadow: var(--shadow-lg); }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex-center { align-items: center; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .text-muted { color: var(--text-muted); }
        code { background: var(--hover); color: var(--primary); padding: 2px 8px; border-radius: 6px; font-size: 13px; }
        .token-display { background: var(--surface-2); border: 1px solid var(--border); padding: 12px; border-radius: 10px; font-family: monospace; font-size: 13px; word-break: break-all; user-select: all; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .preset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all .2s ease; box-shadow: var(--shadow); }
        .preset-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .preset-card.selected { border-color: var(--success); background: #f0fdf4; }
        .preset-card.disabled { opacity: 0.5; cursor: not-allowed; }
        .preset-name { font-weight: 600; margin-bottom: 4px; }
        .preset-url { font-size: 11px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #bottom-tab { display: none; }
        summary::-webkit-details-marker { display: none; }
        summary { list-style: none; }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; display: flex; align-items: center; gap: 8px; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .sidebar .logo { white-space: nowrap; margin-bottom: 0; }
            .sidebar nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .sidebar nav::-webkit-scrollbar { display: none; }
            .nav-item { white-space: nowrap; font-size: 13px; padding: 8px 10px; }
            .sidebar-footer { display: none; }
            .nav-group { display: none; }
            .sidebar { display: none; }
            #bottom-tab { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
                background: var(--surface); border-top: 1px solid var(--border); padding: 6px 2px calc(6px + env(safe-area-inset-bottom)); }
            #bottom-tab > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
                font-size: 11px; color: var(--text-muted); cursor: pointer; padding: 4px 0; border-radius: 8px; }
            #bottom-tab > div.active { color: var(--primary); font-weight: 600; }
            .main { padding: 12px 12px 76px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .stat-card { padding: 16px; }
            .stat-value { font-size: 26px; }
            .grid-2 { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .page-title { font-size: 20px; }
            .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .table-container table { min-width: 560px; }
            .chart { height: 240px !important; }
            .flex { flex-wrap: wrap; gap: 8px; }
        }
        @media (max-width: 400px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .nav-item { font-size: 12px; padding: 7px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo" style="justify-content:space-between;">🌐 Sanl <span style="display:flex;gap:6px;align-items:center;">
                <button class="btn btn-sm btn-secondary" id="lang-btn" onclick="toggleLang()" title="Language" style="padding:4px 8px;font-size:12px;">EN</button>
                <button class="btn btn-sm btn-secondary" id="theme-btn" onclick="toggleTheme()" title="主题" style="padding:4px 8px;font-size:13px;">🌙</button>
                <button class="btn btn-sm btn-secondary" id="logout-btn" onclick="doLogout()" title="退出登录" style="padding:4px 8px;font-size:12px;display:none;">⏻</button>
              </span></div>
            <nav>
                <div class="nav-group">📊 总览</div>
                <div class="nav-item active" data-page="dashboard">📊 仪表盘</div>
                <div class="nav-group" i18n-group="pool">🧩 节点池</div>
                <div class="nav-item" data-page="nodes">🔗 节点列表</div>
                <div class="nav-item" data-page="map">🌍 世界地图</div>
                <div class="nav-item" data-page="sources">📡 来源管理</div>
                <div class="nav-item" data-page="check">⚡ 测速任务</div>
                <div class="nav-item" data-page="gfw">🛡 GFW 检测</div>
                <div class="nav-item" data-page="gfwconfig">⚙️ GFW 配置</div>
                <div class="nav-item" data-page="cfendpoints">☁️ CF 优选</div>
                <div class="nav-group" i18n-group="sub">🔄 订阅转换</div>
                <div class="nav-item" data-page="convert">🔄 订阅转换</div>
                <div class="nav-item" onclick="window.open('/client-guide.html','_self')">📱 客户端订阅</div>
                <div class="nav-item" data-page="subscribe">📥 订阅输出</div>
                <div class="nav-item" data-page="tokens">🔑 令牌管理</div>
                <div class="nav-group" i18n-group="dev">🛠 开发者工具</div>
                <div class="nav-item" data-page="cfworker">🚀 CF Worker</div>
                <div class="nav-item" data-page="sysstatus">💻 系统状态</div>
                <a class="nav-item" href="/docs" target="_blank" style="text-decoration:none;color:inherit;">📚 API 文档</a>
            </nav>
            <div class="sidebar-footer">
                <div id="last-check">最近检查: --</div>
                <div id="total-nodes">总节点: 0</div>
            </div>
        </aside>
        <main class="main" id="main-content"></main>
    </div>
    <div id="toast-container"></div>

    <!-- 登录遮罩层 -->
    <div id="login-overlay" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--bg);align-items:center;justify-content:center;">
        <div style="width:360px;max-width:92vw;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.18);">
            <div style="text-align:center;margin-bottom:20px;">
                <div style="font-size:34px;line-height:1;">🌐</div>
                <div style="font-size:21px;font-weight:700;margin-top:8px;">Sanl</div>
                <div style="color:var(--mut);font-size:12px;margin-top:4px;" id="login-hint">请登录以访问管理面板</div>
            </div>
            <input type="text" id="login-user" placeholder="用户名" autocomplete="username"
                   style="width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);box-sizing:border-box;">
            <input type="password" id="login-pass" placeholder="密码" autocomplete="current-password"
                   style="width:100%;padding:10px 12px;margin-bottom:14px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);box-sizing:border-box;">
            <div id="login-err" style="color:#dc2626;font-size:12px;min-height:16px;margin-bottom:6px;"></div>
            <button id="login-btn" onclick="doLogin()"
                    style="width:100%;padding:11px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-weight:600;font-size:14px;cursor:pointer;">登录</button>
        </div>
    </div>

    <!-- 通用模态框 -->
    <div class="modal" id="modal-overlay">
        <div class="modal-content" id="modal-content"></div>
    </div>

    <script>
        const API = '/api';
        let currentPage = 'dashboard';
        let allNodes = [];
        let _nodeSelected = new Set();

        // 统一 fetch 包装：管理 API 返回 401 时（会话过期）拉起登录遮罩
        const _rawFetch = window.fetch.bind(window);
        let _sessionExpiredShown = false;
        window.fetch = async function (input, init) {
            const resp = await _rawFetch(input, init);
            try {
                const url = typeof input === 'string' ? input : (input && input.url) || '';
                if (resp.status === 401 && url.startsWith('/api/')
                        && !url.includes('/auth/') && !url.includes('/subscribe')) {
                    // 已经处于未登录状态时不重复提示（避免初始加载刷屏）
                    if (_authUser && !_sessionExpiredShown) {
                        _sessionExpiredShown = true;
                        showLoginOverlay('会话已过期，请重新登录');
                    }
                }
            } catch (e) {}
            return resp;
        };

        // ===== 页面渲染 =====
        function showToast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentPage = item.dataset.page;
                renderPage(currentPage);
            });
        });


        function goPage(page) {
            currentPage = page;
            document.querySelectorAll('nav:not(#bottom-tab) .nav-item[data-page]').forEach(i => i.classList.toggle('active', i.dataset.page === page));
            document.querySelectorAll('#bottom-tab > div').forEach(d => {
                const mod = moduleOf(d.dataset.page);
                d.classList.toggle('active', !!(mod && (mod.home === page || mod.pages.some(p => p.id === page))));
            });
            renderPage(page);
            try { window.scrollTo({top:0, behavior:'smooth'}); } catch(e){}
        }
        // ===== 四大模块信息架构 =====
        const MODULES = [
            { id:'dashboard', icon:'📊', zh:'仪表盘', en:'Dashboard', home:'dashboard', pages:[] },
            { id:'pool', icon:'🧩', zh:'节点池', en:'Node Pool', home:'nodes', pages:[
                {id:'nodes', icon:'🔗', zh:'节点列表', en:'Nodes'},
                {id:'map', icon:'🌍', zh:'世界地图', en:'Map'},
                {id:'sources', icon:'📡', zh:'来源管理', en:'Sources'},
                {id:'check', icon:'⚡', zh:'测速任务', en:'Speed Test'},
                {id:'gfw', icon:'🛡', zh:'GFW 检测', en:'GFW Check'},
                {id:'gfwconfig', icon:'⚙️', zh:'GFW 配置', en:'GFW Config'},
                {id:'cfendpoints', icon:'☁️', zh:'CF 优选', en:'CF Hub'},
            ]},
            { id:'sub', icon:'🔄', zh:'订阅转换', en:'Subscription', home:'convert', pages:[
                {id:'convert', icon:'🔄', zh:'订阅转换', en:'Convert'},
                {id:'subscribe', icon:'📥', zh:'订阅输出', en:'Output'},
                {id:'tokens', icon:'🔑', zh:'令牌管理', en:'Tokens'},
            ]},
            { id:'dev', icon:'🛠️', zh:'开发者工具', en:'Developer', home:'cfworker', pages:[
                {id:'cfworker', icon:'🚀', zh:'CF Worker', en:'CF Worker'},
                {id:'sysstatus', icon:'💻', zh:'系统状态', en:'System'},
            ]},
        ];
        function moduleOf(page){ return MODULES.find(m => m.home===page || m.pages.some(p=>p.id===page)); }

        function renderPage(page) {
            // 未登录时不渲染面板内容（避免大量 401 请求与控制台报错）
            if (_authUser === null && _authChecked) {
                showLoginOverlay();
                return;
            }
            if (page === 'cfscan') page = 'cfendpoints';
            const mod = moduleOf(page);
            // 模块内子导航条（多页模块才显示；移动端主要靠它切换）
            let subnav = '';

        async function loadDashboard() {
            try {
                const [statsRes, nodesRes, sourcesRes, rankRes] = await Promise.all([
                    fetch(`${API}/nodes/stats`), fetch(`${API}/nodes?limit=100`),
                    fetch(`${API}/sources`), fetch(`${API}/ranking?limit=5`)
                ]);
                const stats = await statsRes.json();
                const nodes = await nodesRes.json();
                const sources = await sourcesRes.json();
                const rank = await rankRes.json();
                allNodes = nodes;

                if (!document.getElementById('dash-stats')) return;  // 用户已切走页面，放弃本次渲染

                const active = stats.active || 0, total = stats.total || 0;
                document.getElementById('total-nodes').textContent = `总节点: ${total}`;
                document.getElementById('dash-stats').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">总节点数</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#16a34a;">${active}</div><div class="stat-label">可用节点</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#d97706;">${sources.length}</div><div class="stat-label">数据源数</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#2563eb;">${rank.stats?.avg_score || 0}</div><div class="stat-label">平均评分</div></div>
                `;

                const activeNodes = nodes.filter(n => n.status === 'active');
                drawPieChart('chart-country', Object.entries(stats.countries || {}).map(([k,v]) => ({name:k,value:v})));
                const types = {}; nodes.forEach(n => { types[n.node_type] = (types[n.node_type]||0)+1; });
                drawPieChart('chart-type', Object.entries(types).map(([k,v]) => ({name:k.toUpperCase(),value:v})));
                const ranges = {'0-100ms':0,'100-200ms':0,'200-500ms':0,'500ms+':0};
                activeNodes.forEach(n => { if(n.latency<100) ranges['0-100ms']++; else if(n.latency<200) ranges['100-200ms']++; else if(n.latency<500) ranges['200-500ms']++; else ranges['500ms+']++; });
                drawBarChart('chart-latency', Object.keys(ranges), Object.values(ranges));
                // 历史趋势
                try {
                    const trend = await (await fetch(`${API}/stats/trend?limit=30`)).json();
                    drawTrendChart('chart-trend', trend);
                } catch(e) { console.warn('trend load failed', e); }
            } catch(e) { console.error('Dashboard error:', e); }
        }

        function drawTrendChart(id, trend) {
            const el = document.getElementById(id);
            if (!el) return;
            const chart = echarts.init(el);
            if (!trend || !trend.length) {
                el.innerHTML = '<div class="empty">暂无测速历史，跑一次测速后生成趋势</div>';
                return;
            }
            const times = trend.map(t => t.time ? new Date(t.time*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-');
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['存活节点','总节点'], textStyle: { color: '#64748b' } },
                grid: { left: 40, right: 16, bottom: 24, top: 36 },
                xAxis: { type: 'category', data: times, axisLabel: { color: '#64748b', fontSize: 10 } },
                yAxis: { type: 'value', axisLabel: { color: '#64748b' }, splitLine: { lineStyle: { color: '#e2e8f0' } } },
                series: [
                    { name: '存活节点', type: 'line', smooth: true, data: trend.map(t=>t.alive), itemStyle: { color: '#16a34a' }, areaStyle: { opacity: 0.12 } },
                    { name: '总节点', type: 'line', smooth: true, data: trend.map(t=>t.total), itemStyle: { color: '#2563eb' } }
                ]
            });
        }

        function drawPieChart(id, data) {
            const _el = document.getElementById(id);
            if (!_el) return;  // 页面已切换，放弃渲染（修复跨页 null 崩溃）
            // 小切片合并为"其他"（>8 个分类时，占比 <3% 的合并），避免饼图碎成一团
            let pieData = data;
            const total = data.reduce((s, d) => s + d.value, 0);
            if (data.length > 8 && total > 0) {
                const sorted = [...data].sort((a, b) => b.value - a.value);
                const main = sorted.slice(0, 8);
                const restSum = sorted.slice(8).reduce((s, d) => s + d.value, 0);
                if (restSum > 0) main.push({ name: '其他', value: restSum });
                pieData = main;
            }
            const chart = echarts.init(_el);
            chart.setOption({ tooltip:{trigger:'item'}, series:[{type:'pie',radius:['40%','70%'],data:pieData,label:{show:true,formatter:'{b}: {c}'}}] });
        }
        function drawBarChart(id, x, y) {
            const _el = document.getElementById(id);
            if (!_el) return;  // 页面已切换，放弃渲染
            const chart = echarts.init(_el);
            chart.setOption({ tooltip:{trigger:'axis'}, xAxis:{type:'category',data:x}, yAxis:{type:'value'}, series:[{data:y,type:'bar',itemStyle:{color:'#2563eb'}}] });
        }

        // 填充「国家/地区」筛选下拉

        let nodePage = 0, nodePageSize = 50, nodeTotal = 0;

        async function loadNodes(reset = true) {
            if (reset) nodePage = 0;
            const status = document.getElementById('nf-status').value;
            const type = document.getElementById('nf-type').value;
            const sort = document.getElementById('nf-sort') ? document.getElementById('nf-sort').value : 'latency';
            const order = document.getElementById('nf-order') ? document.getElementById('nf-order').value : 'asc';
            const src = document.getElementById('nf-src') ? document.getElementById('nf-src').value : '';
            const cc = document.getElementById('nf-country') ? document.getElementById('nf-country').value : '';
            const offset = nodePage * nodePageSize;
            // 真分页：每次只拉当前页（原写死 limit=200 导致永远只显示前 4 页）
            let url = `${API}/nodes?limit=${nodePageSize}&offset=${offset}&sort=${sort}&order=${order}&_t=${Date.now()}`;
            if (status) url += `&status=${status}`;
            if (type) url += `&node_type=${type}`;
            if (src) url += `&source_type=${src}`;
            if (cc) url += `&country_code=${encodeURIComponent(cc)}`;
            try {
                const nodes = await (await fetch(url)).json();
                allNodes = nodes;
                // 已删除/换页后残留的选择项要清掉，否则计数与实际选中行不符
                const visible = new Set((nodes || []).map(n => n.id));
                _nodeSelected = new Set(Array.from(_nodeSelected).filter(id => visible.has(id)));
                updateNodeBatchDelBtn();
                // 总数用于计算总页数（来自统计接口）
                try {

                renderNodePage();
            } catch(e) { console.error(e); }

        // 列显隐面板：全局唯一、挂在 body 下（fixed 相对视口），彻底避开表格层叠/裁剪/包含块问题
        function ensureColsPanel() {
            let panel = document.getElementById('nf-cols-panel');
            if (panel) return panel;
            panel = document.createElement('div');
            panel.id = 'nf-cols-panel';
            panel.style.cssText = 'position:fixed;z-index:1500;display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:10px 14px;flex-direction:column;gap:6px;min-width:130px;';

                ['latency','延迟列'],['speed','速度列'],

            document.body.appendChild(panel);
            return panel;
        }
        function wireColsPanel() {
            const panel = ensureColsPanel();
            const btn = document.getElementById('nf-cols-btn');
            if (!btn) return;
            btn.onclick = (e) => {
                e.stopPropagation();
                if (panel.style.display === 'flex') { panel.style.display = 'none'; return; }
                panel.style.display = 'flex';
                const r = btn.getBoundingClientRect();
                const pw = panel.offsetWidth, ph = panel.offsetHeight;
                panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pw - 8)) + 'px';
                panel.style.top = (r.bottom + 6 + ph > window.innerHeight ? Math.max(8, r.top - ph - 6) : r.bottom + 6) + 'px';
            };
        }

        // ===== CSV / JSON 导出（优化 #5a）=====
        function exportNodes(fmt) {
            const rows = allNodes || [];
            if (!rows.length) { showToast('没有可导出的节点','error'); return; }
            const lc = document.getElementById('nf-export-latency');
            const withLat = !(lc && !lc.checked);
            let blob, fname;
            if (fmt === 'csv') {
                const head = ['name','type','country'].concat(withLat?['latency_ms']:[]).concat(['speed_Bps','score','status']);
                const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
                const lines = [head.join(',')].concat(rows.map(n => [n.node_name,n.node_type,n.country].concat(withLat?[n.latency]:[]).concat([n.download_speed,(n.score||0).toFixed(1),n.status]).map(esc).join(',')));
                blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
                fname = `nodes_${Date.now()}.csv`;
            } else {
                const mapper = n => Object.assign({name:n.node_name,type:n.node_type,country:n.country}, withLat?{latency:n.latency}:{}, {speed:n.download_speed,score:n.score,status:n.status});
                blob = new Blob([JSON.stringify(rows.map(mapper), null, 2)], {type:'application/json'});
                fname = `nodes_${Date.now()}.json`;
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = fname; a.click();
            URL.revokeObjectURL(a.href);
            showToast(`✅ 已导出 ${rows.length} 个节点 (${fmt.toUpperCase()})`);
        }

        // 国旗 emoji：由 ISO 国家/地区码（两位大写字母）换算，修复 Windows/部分安卓手机无法渲染国旗的问题
        function flagEmoji(code) {
            if (!code || code.length !== 2) return '';
            const A = 0x1F1E6, a = 'A'.charCodeAt(0);
            const c0 = code[0].toUpperCase().charCodeAt(0), c1 = code[1].toUpperCase().charCodeAt(0);
            if (c0 < a || c0 > a + 25 || c1 < a || c1 > a + 25) return '';
            try { return String.fromCodePoint(A + c0 - a, A + c1 - a); }
            catch(e) { return ''; }
        }
        function countryCell(n) {
            // 优先用干净的国家名；若带方框（别字/无法渲染）去掉，再补国旗 emoji
            const raw = (n.country || '');
            const code = (n.country_code || '').trim().toUpperCase();
            const flag = flagEmoji(code);
            const name = (raw || '').replace(/^[^\w\u4e00-\u9fa5]+/, '').replace(/\s+$/, '') || (code ? code : '🌐');
            if (!name) return '🌐';
            return flag ? `${flag} ${name}` : name;
        }

        function streamBadge(flags) {
            if (!flags) return '<span class="text-muted" style="font-size:12px;">-</span>';
            // 流媒体解锁徽章（Netflix/Disney/YouTube 等，来自 full 模式 media-check）
            const map = { 'Netflix':'NF','Disney':'D+','HBO':'HBO','Hulu':'Hulu','YouTube':'YT',

                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: trimmed})
                })).json();

        // ===== ⚡ 手工测速（只测选中节点，不影响其他节点）=====
        async function manualCheckSelected() {
            const ids = Array.from(_nodeSelected);
            if (!ids.length) { showToast('请先选择要测速的节点', 'error'); return; }
            if (!confirm(`对选中的 ${ids.length} 个节点做手工测速？\n\n· 只测这些节点，不扫全池\n· 只更新这些节点的状态，其他节点不受影响\n· 同时补齐地区信息并按地区规范化命名（已自定义命名的不动）`)) return;
            try {
                const r = await (await fetch(`${API}/nodes/manual-check`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ids, mode: 'latency', rename: true, refresh_geo: true})
                })).json();
                if (r.detail) { showToast('启动失败: ' + r.detail, 'error'); return; }
                _manualCheckPoll(ids);
            } catch(e) { showToast('启动失败: ' + (e.message||'网络错误'), 'error'); }
        }

        // 手工测速实时进度面板（替代"一秒完成"的无反馈体验）
        function _manualCheckPoll(ids) {
            // 就地插入进度条（不跳页、不打断选择状态）
            const old = document.getElementById('mc-progress-panel');
            if (old) old.remove();
            const panel = document.createElement('div');
            panel.id = 'mc-progress-panel';
            panel.style.cssText = 'position:fixed;right:20px;bottom:20px;z-index:1600;background:var(--card,#fff);border:1px solid var(--border,#e2e8f0);border-radius:12px;padding:14px 18px;box-shadow:0 8px 30px rgba(0,0,0,.18);min-width:280px;font-size:13px;';
            panel.innerHTML = `
                <div style="font-weight:700;margin-bottom:8px;">⚡ 手工测速（${ids.length} 个节点）</div>
                <div style="height:8px;background:var(--surface,#f1f5f9);border-radius:4px;overflow:hidden;margin-bottom:8px;">
                    <div id="mc-bar" style="height:100%;width:5%;background:var(--primary,#2563eb);border-radius:4px;transition:width .4s;"></div>
                </div>
                <div id="mc-detail" style="color:var(--text-muted,#64748b);font-size:12px;">启动中…（50 节点约需 10~30 秒）</div>`;
            document.body.appendChild(panel);

            let tries = 0;
            const timer = setInterval(async () => {
                tries++;
                if (tries > 200) { clearInterval(timer); panel.remove(); return; }  // 最多 10 分钟
                try {
                    const d = await (await fetch(`${API}/tasks`)).json();
                    const t = (d.active || []).find(x => x.name && x.name.includes('手工测速'));
                    if (t) {
                        // 实时进度：detail + 百分比
                        const detail = t.detail || '测速中…';
                        const pct = (t.total > 0 && t.done <= t.total)
                            ? Math.round(t.done / t.total * 100)
                            : (t.pct >= 0 ? t.pct : 12);
                        const bar = document.getElementById('mc-bar');
                        const det = document.getElementById('mc-detail');
                        if (bar) bar.style.width = Math.max(5, Math.min(96, pct)) + '%';
                        if (det) det.textContent = detail;
                        return;
                    }
                    // 任务结束 → 读 recent 拿结果摘要
                    clearInterval(timer);
                    const recent = (d.recent || []).find(x => x.name && x.name.includes('手工测速'));
                    const summary = recent ? (recent.detail || (recent.error ? '❌ ' + recent.error : '完成')) : '完成';
                    const bar = document.getElementById('mc-bar');
                    const det = document.getElementById('mc-detail');
                    if (bar) { bar.style.width = '100%'; bar.style.background = '#16a34a'; }
                    if (det) det.textContent = '✅ ' + summary;
                    showToast('✅ 手工测速完成：' + summary, 'success');
                    // 停 1.2s 让用户看到结果，再刷新列表并收起面板
                    setTimeout(() => {
                        _nodeSelected.clear();
                        updateNodeBatchDelBtn();
                        loadNodes();
                        setTimeout(() => panel.remove(), 800);
                    }, 1200);
                } catch(e) {}
            }, 1500);
        }

        function renderNodeTable(nodes) {

            const cols = [
                ['sel','',''], ['star','',''], ['id','编号'], ['name','名称'], ['type','协议'],

                ['score','评分'], ['grade','等级'], ['status','状态'],
                ['stream','解锁',''], ['trend','📈',''], ['ban','🚫',''], ['rename','✏️',''], ['del','🗑','']

                // inactive 节点的延迟/速度/评分是上一轮成功时的旧数据，灰显避免误导

                const staleColor = n.status !== 'active' ? ' style="color:#94a3b8;" title="旧数据（该节点最近一轮测速未通过）"' : ` style="color:${scoreColor};"`;

                    star: `<td style="cursor:pointer;font-size:16px;" onclick="toggleFavorite(${n.id})" title="收藏（订阅置顶）">${starIcon(n)}</td>`,

                    type: `<td><span class="badge badge-info">${(n.node_type||'').toUpperCase()}</span></td>`,
                    country: `<td>${countryCell(n)}</td>`,
                    ip: `<td style="font-family:ui-monospace,monospace;font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;"

                    latency: `<td${stale}>${n.latency ? n.latency+'ms' : '-'}</td>`,
                    speed: `<td${stale}>${speed}</td>`,

                    ban: `<td style="cursor:pointer;white-space:nowrap;" title="${n.status==='banned'?'解封':'封禁'}">${n.status==='banned'

        // ===== 世界地图 =====
        let mapChart = null;

        // 本地加载世界地图 GeoJSON 并注册到 ECharts（ECharts 5 不内置地图）
        function ensureWorldMap() {
            if (typeof echarts === 'undefined') {
                return Promise.reject(new Error('echarts 未加载'));
            }
            if (echarts.getMap && echarts.getMap('world')) return Promise.resolve(true);
            if (worldMapReady) return worldMapReady;
            worldMapReady = fetch('/vendor/world.json?v=1')
                .then(r => { if (!r.ok) throw new Error('world.json HTTP ' + r.status); return r.json(); })
                .then(geo => { echarts.registerMap('world', geo); return true; })
                .catch(e => { worldMapReady = null; throw e; });
            return worldMapReady;
        }

        async function loadMapData() {
            try {
                const [mapRes, statsRes] = await Promise.all([fetch(`${API}/map`), fetch(`${API}/nodes/stats`)]);
                const mapData = await mapRes.json();
                const stats = await statsRes.json();

                const countries = mapData.countries || [];
                if (!document.getElementById('map-stats')) return;  // 已离开地图页，放弃本次渲染
                const total = countries.reduce((s,c) => s+c.count, 0);
                document.getElementById('map-stats').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${countries.length}</div><div class="stat-label">覆盖国家/地区</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#16a34a;">${total}</div><div class="stat-label">已定位节点</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#d97706;">${stats.active||0}</div><div class="stat-label">可用节点</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#2563eb;">${stats.total||0}</div><div class="stat-label">总节点</div></div>
                `;

                // 世界地图散点图（先确保本地 GeoJSON 注册成功，失败则降级为纯散点）
                if (mapChart) mapChart.dispose();
                mapChart = echarts.init(document.getElementById('chart-world'));
                const scatterData = mapData.scatter && mapData.scatter.length > 0 ? mapData.scatter :
                    countries.map(c => ({name: c.name, value: [c.lng, c.lat, c.count]}));

                let worldOk = false;
                try { worldOk = await ensureWorldMap(); } catch(e) { console.warn('世界地图底图加载失败:', e); }

                const mapOption = {
                    tooltip: { trigger: 'item', formatter: p => `${p.name}<br/>节点数: ${p.value[2]}` },
                    series: [{
                        type: 'scatter', coordinateSystem: worldOk ? 'geo' : 'cartesian2d',
                        data: scatterData.map(d => ({name: d.name, value: [d.value[0]||d.lng, d.value[1]||d.lat, d.value[2]||d.count]})),
                        symbolSize: v => Math.max(5, Math.min(30, v[2] * 3)),
                        itemStyle: { color: '#2563eb', opacity: 0.75 },
                        encode: { value: 2 },
                        // 世界地图上也显示国家名（节点数≥3 才显示，避免密集），原 worldOk 时完全隐藏导致地图标签太模糊
                        label: { show: true, formatter: p => (p.value && p.value[2] >= 3) ? p.name : '',
                                 position: 'right', color: '#475569', fontSize: 10 }
                    },
                    // 热门地区波纹动画（大纲 附录 I.2 effectScatter）：节点数 TOP 5
                    {
                        type: 'effectScatter', coordinateSystem: worldOk ? 'geo' : 'cartesian2d',
                        data: (() => {
                            const top5 = [...scatterData].sort((a,b) => (b.value?b.value[2]:b.count) - (a.value?a.value[2]:a.count)).slice(0, 5);
                            return top5.map(d => ({name: d.name, value: [d.value[0]||d.lng, d.value[1]||d.lat, d.value[2]||d.count]}));
                        })(),
                        symbolSize: v => Math.max(10, Math.min(34, v[2] * 3.4)),
                        rippleEffect: { brushType: 'stroke', scale: 3.2 },
                        itemStyle: { color: '#f59e0b', shadowBlur: 12, shadowColor: 'rgba(245,158,11,.6)' },
                        encode: { value: 2 },
                        label: { show: true, formatter: p => `🔥 ${p.name}`, position: 'right', color: '#d97706', fontSize: 11, fontWeight: 600 }
                    }]
                };
                if (worldOk) {
                    mapOption.geo = { map: 'world', roam: true, zoom: 1.2, left: 0, right: 0,
                        label: { show: false }, itemStyle: { areaColor: '#dbeafe', borderColor: '#ffffff' },
                        emphasis: { itemStyle: { areaColor: '#0ea5e9' } } };
                } else {
                    // 降级：无底图时用经纬度直角坐标系展示散点
                    mapOption.xAxis = { type: 'value', min: -180, max: 180, show: false };
                    mapOption.yAxis = { type: 'value', min: -60, max: 85, show: false };
                    mapOption.grid = { left: 10, right: 10, top: 10, bottom: 10 };
                    mapOption.series[0].data = mapOption.series[0].data.map(d =>
                        ({ name: d.name, value: [d.value[0], d.value[1], d.value[2]] }));
                }
                mapChart.setOption(mapOption);

                // 国家柱状图
                const top10 = countries.slice(0, 15);
                drawBarChart('chart-country-bar', top10.map(c => c.name), top10.map(c => c.count));
            } catch(e) { console.error('Map error:', e); }
        }

        async function openCfScanLegacy(){
            // 网段扫描已合并进优选中心；此入口临时恢复渲染旧扫描器页面（保留全部功能）
            const main = document.getElementById('main-content');
            await renderCfScan(main);
        }
        async function harvestCf(btn){
            const raw = (document.getElementById('cf-harvest-input')||{}).value || '';
            const port = parseInt((document.getElementById('cf-harvest-port')||{}).value||'443',10);
            if(!raw.trim()){ showToast('请先粘贴优选域名或 IP','error'); return; }
            btn.disabled=true; btn.textContent='⏳ 解析中…';
            try{
                const res = await fetch(`${API}/cf/harvest?domains=${encodeURIComponent(raw)}&port=${port}`, {method:'POST'});
                if(!res.ok) throw new Error(await res.text());
                showToast('📥 已提交后台解析入库，稍后自动刷新','success');
                setTimeout(()=>{ loadCfEndpoints(); btn.disabled=false; btn.textContent='📥 解析并入库'; }, 6000);
            }catch(e){
                showToast('❌ 入库失败: '+e.message,'error');
                btn.disabled=false; btn.textContent='📥 解析并入库';
            }
        }
        async function toNodesCf(btn){
            const topn = parseInt((document.getElementById('cf-tonodes-topn')||{}).value||'50',10);
            const cap = parseInt((document.getElementById('cf-tonodes-cap')||{}).value||'10',10);
            const isp = (document.getElementById('cf-isp-filter')||{}).value || 'any';
            btn.disabled=true; btn.textContent='⏳ 生成中…';
            try{
                const res = await fetch(`${API}/cf/to-nodes?top_n=${topn}&max_per_template=${cap}&isp=${isp}`, {method:'POST'});
                const d = await res.json();
                if(!res.ok) throw new Error(d.detail||await res.text());
                if(d.templates===0){ showToast('⚠️ '+(d.message||'无可用模板/端点'),'error'); }
                else showToast(`✅ 已生成 ${d.variants_created} 个变体节点入池（新增 ${d.inserted}，去重 ${d.variants_created-d.inserted}），去「节点」页触发测速即可排名使用`,'success');
            }catch(e){
                showToast('❌ 转换失败: '+e.message,'error');
            }finally{
                btn.disabled=false; btn.textContent='⭐ 一键转节点入池';
            }
        }

        // ===== CF 优选 =====
        let cfData = [];
        function ispLabel(isp){ return ({telecom:'📶 电信',mobile:'📶 移动',unicom:'📶 联通',all:'🌐 三网'})[isp] || isp || 'all'; }
        async function loadCfEndpoints(){
            try{
                const sort = (document.getElementById('cf-sort-filter')||{}).value || 'latency';
                const alive = document.getElementById('cf-only-alive')?.checked ? '&only_alive=true' : '';
                const ipv = (document.getElementById('cf-ipver-filter')||{}).value || '';
                const res = await fetch(`${API}/cf/endpoints?limit=20000&sort=${sort}${alive}${ipv?`&ip_version=${ipv}`:''}`);
                if(!res.ok) throw new Error(await res.text());
                const d = await res.json();
                cfData = d.endpoints||[];
                const by = d.by_isp||{}, bv = d.by_ip_version||{};
                const cards = document.getElementById('cf-hub-stats');
                if (cards) cards.innerHTML =
                    ['telecom','mobile','unicom','all'].map(k=>`
                      <div class="stat-card"><div class="stat-value">${by[k]||0}</div>
                      <div class="stat-label">${ispLabel(k)}优选</div></div>`).join('')
                    + `<div class="stat-card"><div class="stat-value">${bv[4]||0}</div><div class="stat-label">IPv4 端点</div></div>`
                    + `<div class="stat-card"><div class="stat-value">${bv[6]||0}</div><div class="stat-label">IPv6 端点</div></div>`;
                renderCfTable();
            }catch(e){ showToast('❌ CF优选加载失败: '+e.message,'error'); }
        }
        function cfLatencyBadge(la){
            if (la == null) return '<span class="text-muted">—</span>';
            const cls = la < 100 ? 'badge-success' : la < 200 ? 'badge-warning' : 'badge-danger';
            return `<span class="badge ${cls}">${la}ms</span>`;
        }
        function cfVerBadge(v){
            if (v === 4) return '<span class="badge badge-success">v4</span>';
            if (v === 6) return '<span class="badge badge-warning">v6</span>';
            return '<span class="badge badge-secondary">域名</span>';
        }
        async function pingCfEndpoints(btn){
            btn.disabled = true; btn.textContent = '⏳ 检测中…';
            try{
                const isp = (document.getElementById('cf-isp-filter')||{}).value || 'any';
                const res = await fetch(`${API}/cf/ping?isp=${isp}&limit=20000`, {method:'POST'});
                if(!res.ok) throw new Error(await res.text());
                showToast('⚡ 延迟检测已启动，约 30-60 秒后自动刷新','success');
                setTimeout(()=>{ loadCfEndpoints(); btn.disabled=false; btn.textContent='⚡ 测延迟'; }, 45000);
            }catch(e){
                showToast('❌ 启动失败: '+e.message,'error');
                btn.disabled=false; btn.textContent='⚡ 测延迟';
            }
        }
        function renderCfTable(){
            const tb = document.getElementById('cf-tbody'); if(!tb) return;
            const f = (document.getElementById('cf-isp-filter')||{}).value || 'any';
            const exp = document.getElementById('cf-export-btn');
            if (exp) exp.href = `${API}/cf/endpoints/export?isp=${f}&limit=20000`;
            const rows = cfData.filter(e=>f==='any'||e.isp===f);
            tb.innerHTML = rows.slice(0,1000).map(e=>{
                const t = e.last_seen_at ? new Date(e.last_seen_at*1000).toLocaleString() : '-';
                return `<tr><td>${cfLatencyBadge(e.latency_ms)}</td><td>${cfVerBadge(e.ip_version)}</td><td><code>${e.host}:${e.port}</code></td><td>${e.remark||''}</td><td>${ispLabel(e.isp)}</td><td class="text-muted">${t}</td></tr>`;
            }).join('') || '<tr><td colspan="6" class="text-muted">暂无数据——先到源列表页点「🔄 全量导入」</td></tr>';
        }
        function copyCfEndpoints(btn){
            const f = (document.getElementById('cf-isp-filter')||{}).value || 'any';
            const lines = cfData.filter(e=>f==='any'||e.isp===f).map(e=>`${e.host}:${e.port}#${e.remark||e.isp}`);
            navigator.clipboard.writeText(lines.join('\n')).then(()=>{
                if (btn) { btn.textContent='✅ 已复制'; setTimeout(()=>btn.textContent='📋 复制当前',1500); }
                else showToast(`✅ 已复制 ${lines.length} 条端点`);
            }).catch(()=>showToast('复制失败，请用导出 txt','error'));
        }

        let scanRange = 'official';
        function switchScanRange(r){
            scanRange = r;
            document.getElementById('scan-range-official').className = 'btn '+(r==='official'?'btn-primary':'btn-secondary');

        async function startCfScan(btn){
            const speedKey = document.getElementById('sc-speed-key').value;
            const q = new URLSearchParams({
                ip_type: document.getElementById('sc-ip-type').value,
                port: document.getElementById('sc-port').value,
                concurrency: document.getElementById('sc-concurrency').value,
                max_latency: document.getElementById('sc-max-latency').value,
                min_speed: document.getElementById('sc-min-speed').value,
                top_n: document.getElementById('sc-top-n').value,
                scan_mode: document.getElementById('sc-mode').value,
                slim: document.getElementById('sc-slim').checked,
                speed_key: speedKey==='__custom__' ? '' : speedKey,
                speed_url: speedKey==='__custom__' ? document.getElementById('sc-speed-url').value.trim() : '',
                custom_ranges: scanRange==='custom' ? document.getElementById('sc-custom-ranges').value.trim() : '',
            });
            btn.disabled = true; btn.textContent='⏳ 扫描中…';
            try{
                const res = await fetch(`${API}/cf/scan?${q}`, {method:'POST'});
                if(!res.ok) throw new Error((await res.json()).detail||res.status);
                showToast('🛰 扫描已启动','success');
                if(scanTimer) clearInterval(scanTimer);
                scanTimer = setInterval(loadScanStatus, 1500);
            }catch(e){ showToast('❌ 启动失败: '+e.message,'error'); btn.disabled=false; btn.textContent='✨ 开始扫描与测试'; }
        }
        async function loadScanStatus(){
            try{
                const s = await (await fetch(`${API}/cf/scan/status`)).json();
                const pt = document.getElementById('sc-progress-text');
                if(pt) pt.textContent = s.running
                    ? `${s.phase} · ${s.scanned}/${s.total} · 已合格 ${s.found}`
                    : (s.phase==='done' ? `完成 · 合格 ${s.found} 个` : (s.phase||'等待操作…'));
                const lg = document.getElementById('sc-log');
                if(lg && s.log && s.log.length && lg.dataset.n !== String(s.log.length)){
                    lg.dataset.n = String(s.log.length);
                    lg.textContent = s.log.slice(-30).join('\n'); lg.scrollTop = lg.scrollHeight;
                }
                if(!s.running){
                    if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }
                    const b = document.getElementById('sc-start-btn');
                    if(b && b.disabled){ b.disabled=false; b.textContent='✨ 开始扫描与测试'; loadScanResults(); }
                }
            }catch(e){}
        }
        async function loadScanResults(){
            try{
                const d = await (await fetch(`${API}/cf/scan/results?limit=500`)).json();
                const tb = document.getElementById('sc-results-tbody'); if(!tb) return;
                tb.innerHTML = d.results.map(r=>{
                    const t = r.created_at? new Date(r.created_at*1000).toLocaleString():'-';
                    return `<tr><td>${r.latency_ms!=null?r.latency_ms+'ms':'—'}</td>
                        <td>${r.speed_mbps!=null? r.speed_mbps+' MB/s':'—'}</td>
                        <td><code>${r.ip}</code></td><td>${r.port}</td>
                        <td>${r.colo||'—'}</td><td class="text-muted">${t}</td></tr>`;
                }).join('') || '<tr><td colspan="6" class="text-muted">暂无结果——配置参数后点「开始扫描与测试」</td></tr>';
                const exp = document.getElementById('sc-export-btn');
                if (exp) {
                    const withLat = (()=>{ const c=document.getElementById('sc-export-latency'); return c && c.checked; })();
                    const lines = d.results.map(r => withLat && r.latency_ms!=null ? `${r.ip}:${r.port}#${r.latency_ms}ms` : `${r.ip}:${r.port}`);
                    exp.href = `data:text/plain;charset=utf-8,${encodeURIComponent(lines.join('\n'))}`;
                    exp.download = 'cf_scan_results.txt';
                }
            }catch(e){}
        }
        function copyScanResults(btn){
            fetch(`${API}/cf/scan/results?limit=500`).then(r=>r.json()).then(d=>{
                navigator.clipboard.writeText(d.results.map(r=>`${r.ip}:${r.port}`).join('\n')).then(()=>{
                    btn.textContent='✅ 已复制'; setTimeout(()=>btn.textContent='📋 一键复制全部',1500);
                }).catch(()=>showToast('复制失败','error'));
            });
        }
        async function clearScanResults(){
            await fetch(`${API}/cf/scan/results`, {method:'DELETE'});

        async function uploadImportFile(input) {

            try {

        async function importSubUrl() {
            const name = document.getElementById('imp-sub-name').value.trim() || '手动订阅';
            const url = document.getElementById('imp-sub-url').value.trim();
            if (!url) return showToast('请输入订阅链接', 'error');

        async function importBatchNodes() {
            const content = document.getElementById('imp-batch').value.trim();
            const label = document.getElementById('imp-batch-label').value.trim() || '手动导入';
            const out = document.getElementById('imp-batch-result');
            if (!content) return showToast('请粘贴节点内容', 'error');
            out.textContent = '解析导入中...';
            try {
                const res = await fetch(`${API}/nodes/import`, { method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ content, label }) });

                if (res.ok) {
                    out.textContent = `✅ 成功 ${d.imported} 条${d.skipped?`，跳过重复 ${d.skipped}`:''}${d.errors.length?`，失败 ${d.errors.length}`:''}`;
                    showToast(`导入完成：${d.imported} 条节点已入库`);
                    document.getElementById('imp-batch').value = '';

        async function importSingleNode() {
            const g = id => document.getElementById(id).value.trim();
            const out = document.getElementById('imp-single-result');
            const type = g('imp-single-type');
            const secret = g('imp-single-secret') || null;
            // 按协议把 secret 映射到正确字段名
            let body = {
                type, server: g('imp-single-server'),
                port: parseInt(g('imp-single-port')) || 0,
                password: secret, uuid: secret,
                cipher: g('imp-single-cipher') || null, sni: g('imp-single-sni') || null,
                name: g('imp-single-name') || null
            };
            // 合并扩展参数 JSON（承载 wireguard 的 public_key/private_key 等）
            const extraRaw = g('imp-single-extra');
            if (extraRaw) {
                try { Object.assign(body, JSON.parse(extraRaw)); }
                catch(e) { return showToast('扩展参数 JSON 格式错误', 'error'); }
            }
            // 按类型裁剪无用字段，避免后端困惑
            const NEED_UUID = ['vmess','vless','tuic'];
            const NEED_PWD = ['ss','trojan','hysteria2','hy2','snell'];
            if (!NEED_UUID.includes(type)) delete body.uuid;
            if (!NEED_PWD.includes(type) && !['socks5','http','ssr','wireguard','hysteria'].includes(type)) delete body.password;
            if (type === 'wireguard') { delete body.password; delete body.uuid; }
            if (type === 'hysteria') { delete body.uuid; }
            if (!body.server || !body.port) return showToast('请填服务器和端口', 'error');
            try {
                const res = await fetch(`${API}/nodes/import/single`, { method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(body) });
                const d = await res.json();
                if (res.ok) { out.textContent = `✅ 已保存: ${d.name}`; showToast('节点已入库'); }
                else { out.textContent = '❌ ' + (d.detail||''); }
            } catch(err) { out.textContent = '❌ 网络错误'; }
        }

        // 源列表缓存 + 筛选/多选状态
        let _srcAll = [], _srcHealth = [], _srcSelected = new Set();

        async function loadSources() {
            try {
                const [sources, health, stats] = await Promise.all([
                    fetch(`${API}/sources?enabled=false&include_manual=true`).then(r=>r.json()),
                    fetch(`${API}/sources/health`).then(r=>r.json()),
                    fetch(`${API}/nodes/stats`).then(r=>r.json())
                ]);
                const healthEl = document.getElementById('source-health');
                const tbodyEl = document.getElementById('sources-tbody');
                if (!healthEl || !tbodyEl) return;  // 页面已切换，放弃本次渲染（修复跨页 null 崩溃）
                _srcAll = Array.isArray(sources) ? sources : [];
                _srcHealth = Array.isArray(health) ? health : [];

                const healthy = _srcHealth.filter(h => h.state === 'healthy').length;
                const unhealthy = _srcHealth.filter(h => h.state === 'unhealthy').length;
                // 累计节点 = 各源当前实际关联节点数之和 + 无源归属（测速回填）节点
                // ⚠ 不能用 nodes/stats.total 之外的口径混搭，也不能用 sources.node_count
                //   （那是"上次抓取解析数"，与库内归属对不上，用户看到的数字会互相矛盾）
                const actualSum = _srcHealth.reduce((a, h) => a + (h.actual_nodes || 0), 0);
                const orphan = _srcHealth.length ? (stats && stats.pool_total
                    ? Math.max(0, stats.pool_total - actualSum) : 0) : 0;
                const nodeCount = actualSum;
                healthEl.innerHTML = `
                    <div class="stat-card"><div class="stat-value">${_srcAll.length}</div><div class="stat-label">数据源总数</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#16a34a;">${healthy}</div><div class="stat-label">健康源</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#dc2626;">${unhealthy}</div><div class="stat-label">异常源</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#2563eb;">${nodeCount}</div>
                        <div class="stat-label">累计节点${orphan > 0 ? `（另有 ${orphan} 个测速回填）` : ''}</div></div>
                `;
                renderSourcesTable();
            } catch(e) { console.error(e); showToast('数据源加载失败: ' + (e.message||'网络错误'), 'error'); }
        }

        // 按当前筛选条件渲染源表格（筛选只影响显示，不影响已选集合）
        function renderSourcesTable() {
            const tbody = document.getElementById('sources-tbody');
            if (!tbody) return;

            const stateFilter = (document.getElementById('src-filter-state') || {}).value || 'all';
            const keyword = ((document.getElementById('src-filter-keyword') || {}).value || '').trim().toLowerCase();
            const showDisabled = (document.getElementById('src-show-disabled') || {}).checked;

            const healthMap = new Map(_srcHealth.map(h => [h.id, h]));
            const rows = _srcAll.map(s => {
                const h = healthMap.get(s.id);
                const st = h ? (h.state || (h.healthy ? 'healthy' : 'unhealthy'))
                             : (s.last_status === 1 && s.enabled ? 'healthy' : (s.last_status === 0 ? 'pending' : 'unhealthy'));
                return {s, st};
            }).filter(({s, st}) => {
                if (!showDisabled && !s.enabled) return false;
                if (stateFilter !== 'all' && st !== stateFilter) return false;
                if (keyword) {
                    const hay = `${s.name || ''} ${s.url || ''}`.toLowerCase();
                    if (!hay.includes(keyword)) return false;
                }
                return true;
            });

            if (!rows.length) {
                tbody.innerHTML = `<tr><td colspan="8" class="empty"><div class="empty-icon">🔍</div>没有符合筛选条件的数据源</td></tr>`;
                updateBatchDeleteBtn();
                return;
            }

            tbody.innerHTML = rows.map(({s, st}) => {
                const stest = s.speed_test === undefined || s.speed_test === null ? 1 : s.speed_test;
                const badge = st === 'healthy' ? '<span class="badge badge-success">健康</span>'
                            : st === 'pending' ? '<span class="badge badge-info">待抓取</span>'
                            : st === 'failed' ? `<span class="badge badge-danger">抓取失败×${s.fail_count||1}</span>`
                            : `<span class="badge badge-danger">异常${(s.fail_count||0) >= 3 ? '×'+s.fail_count : ''}</span>`;
                const checked = _srcSelected.has(s.id) ? ' checked' : '';
                const disabledTag = s.enabled ? '' : ' <span class="badge badge-secondary">已禁用</span>';
                // 节点数显示库内真实归属（h.actual_nodes），title 里附"上次解析数"备查
                const h = healthMap.get(s.id);
                const actualN = h ? (h.actual_nodes ?? s.node_count ?? 0) : (s.node_count || 0);
                return `<tr><td><input type="checkbox" class="src-cb" data-id="${s.id}"${checked} onchange="toggleSourceSelect(${s.id}, this.checked)"></td>
                    <td>${escHtml(s.name || '')}${disabledTag}</td>
                    <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;font-size:12px;" title="${escHtml(s.url||'')}">${escHtml(s.url||'')}</td>
                    <td><span class="badge badge-info">${escHtml(s.source_type||'')}</span></td>
                    <td title="库内实际归属 ${actualN} 个；上次抓取解析 ${s.node_count||0} 个">${actualN}</td>
                    <td>${badge}</td>
                    <td>
                        <button class="btn btn-sm ${stest ? 'btn-primary' : 'btn-secondary'}" onclick="toggleSpeedTest(${s.id},${stest?0:1})"
                            title="该源是否参与测速任务（与是否正在测速无关）">${stest ? '⚡ 已加入' : '⏸ 已跳过'}</button>
                    </td>
                    <td style="white-space:nowrap;">
                        <button class="btn btn-sm ${s.enabled ? 'btn-secondary' : 'btn-primary'}" onclick="toggleSource(${s.id},${!s.enabled})">${s.enabled ? '禁用' : '启用'}</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteSource(${s.id})">删除</button>
                    </td></tr>`;
            }).join('');
            updateBatchDeleteBtn();
        }

        function updateBatchDeleteBtn() {
            const delBtn = document.getElementById('src-batch-del-btn');
            const fetchBtn = document.getElementById('src-batch-fetch-btn');
            const n = _srcSelected.size;
            if (delBtn) {
                delBtn.disabled = n === 0;
                delBtn.textContent = `🗑 删除选中 (${n})`;
            }
            if (fetchBtn) {
                fetchBtn.disabled = n === 0;
                fetchBtn.textContent = `🚀 抓取选中 (${n})`;
            }
        }

        // ===== 🚀 手动抓取选中的源（逐个同步抓取，实时反馈结果）=====
        async function fetchSelectedSources() {
            const ids = Array.from(_srcSelected);
            if (!ids.length) { showToast('请先选择要抓取的数据源', 'error'); return; }
            const btn = document.getElementById('src-batch-fetch-btn');
            const names = _srcAll.filter(s => _srcSelected.has(s.id)).map(s => s.name);
            if (!confirm(`手动抓取选中的 ${ids.length} 个数据源？\n\n${names.slice(0,5).join('\n')}${names.length > 5 ? '\n…' : ''}\n\n（同步执行，抓完逐个显示结果）`)) return;
            btn.disabled = true; btn.textContent = '⏳ 抓取中…';
            let ok = 0, failed = 0;
            const failNames = [];
            for (const id of ids) {
                try {
                    const r = await (await fetch(`${API}/sources/${id}/fetch`, {method:'POST'})).json();
                    if (r.status === 'ok') {
                        ok++;
                        showToast(`✅ ${r.source}：解析 ${r.parsed} 个节点（新增 ${r.inserted}）`, 'success');
                    } else if (r.status === 'already_running') {
                        showToast('⚠ 已有测速任务在跑，请稍后再试', 'error');
                        break;
                    } else {
                        failed++; failNames.push(r.source || `源#${id}`);
                        showToast(`❌ ${r.source || '源#'+id}：${r.error || '抓取失败'}`, 'error');
                    }
                } catch(e) {
                    failed++; failNames.push(`源#${id}`);
                }
            }
            btn.disabled = false;
            updateBatchDeleteBtn();
            _srcSelected.clear();
            const all = document.getElementById('src-select-all');
            if (all) all.checked = false;
            if (ids.length > 1) showToast(`🚀 批量抓取完成：${ok} 成功 / ${failed} 失败${failNames.length ? '（' + failNames.join('、') + '）' : ''}`, failed ? 'error' : 'success');
            loadSources();
        }

        function toggleSourceSelect(id, checked) {
            if (checked) _srcSelected.add(id);
            else _srcSelected.delete(id);
            updateBatchDeleteBtn();
        }

        function toggleSelectAllSources(cb) {
            // 只对当前可见（筛选后）的行全选/取消
            document.querySelectorAll('#sources-tbody .src-cb').forEach(el => {
                const id = parseInt(el.dataset.id);
                el.checked = cb.checked;
                if (cb.checked) _srcSelected.add(id);
                else _srcSelected.delete(id);
            });
            updateBatchDeleteBtn();
        }

                if (r.detail) { showToast('删除失败: ' + r.detail, 'error'); return; }

        function showPresetModal() {
            document.getElementById('modal-overlay').classList.add('show');

        // ===== 测速任务 =====

                        </div>
                        <p class="text-muted" style="font-size:11px;margin-top:6px;">⚠️ 测速并发×节点速度 不要超过出口总带宽，否则结果偏低。「参与源数量」只测节点数最多的前 N 个源，显著提速。参数仅对本次任务生效。</p>
                    </details>

                <div class="chart-container" style="margin-bottom:16px;">

                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;" id="ck-scopes">
                        ${CHECK_SCOPES.map(s => `
                            <div class="ck-mode-card" data-scope="${s.id}" onclick="pickScope('${s.id}')"
                                style="cursor:pointer;border:2px solid var(--border);border-radius:12px;padding:12px 14px;transition:all .15s;">
                                <div style="font-weight:700;font-size:14px;">${s.icon} ${s.name}</div>
                                <div class="text-muted" style="font-size:11.5px;margin-top:4px;line-height:1.5;">${s.desc}</div>
                            </div>`).join('')}
                    </div>
                    <div class="text-muted" style="font-size:12px;margin-top:8px;" id="ck-scope-hint">加载中…</div>
                </div>
                <div class="chart-container" style="margin-bottom:16px;">
                    <h3 style="margin-bottom:12px;">🎯 合格判定</h3>
                    <div class="flex" style="align-items:center;gap:10px;flex-wrap:wrap;">
                        <label class="text-muted" style="font-size:13px;">合格延迟上限（ms，超过视为不合格，订阅默认不输出）</label>
                        <input class="form-input" id="ck-threshold" type="number" min="50" max="5000" step="50" style="width:120px;">
                        <button class="btn btn-primary btn-sm" onclick="saveThreshold(this)">💾 保存并立即重判</button>

                    </div>
                </div>
                <div id="ck-progress"></div>
                <div class="page-header" style="margin-top:28px;"><h2 style="font-size:20px;font-weight:700;">📜 任务历史</h2></div>

                    <th>ID</th><th>类型</th><th>状态</th><th>开始时间</th><th>耗时</th><th>结果</th>

        async function loadScopeHint() {
            // 显示手动导入节点数量，让用户知道「仅手动导入」测的是什么
            const hint = document.getElementById('ck-scope-hint');
            if (!hint) return;
            try {
                // limit=1 只拿一条，总数要用 /nodes/stats 或全量列表
                const nodes = await (await fetch(`${API}/nodes?limit=1000&source_type=manual`)).json();
                const total = Array.isArray(nodes) ? nodes.length : 0;
                hint.textContent = total
                    ? `当前手动导入节点 ${total} 个。选「仅手动导入」可单独验证自己的节点是否可用（不消耗公共池测速资源）。`
                    : '当前没有手动导入的节点。可到「来源管理 → 手动导入」添加。';
