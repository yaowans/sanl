# Sanl 示例配置 — 复制为 config/app.yaml 后按需修改
app:
  name: "Sanl"
  version: "2.3.0"
  debug: false            # 生产环境建议 false
  host: "0.0.0.0"
  port: 8899
  api_key: "CHANGE_ME_TO_RANDOM_SECRET"   # Web API 认证密钥，务必修改

database:
  path: "./data/nodes.db" # SQLite；Docker 卷挂载 data/ 即可持久化

# GFW 境内可达性检测（部署期兜底配置）
# ⚠️ 推荐在管理面板「GFW 配置」页填写——保存后落库立即生效，无需重启容器。
#    此处仅作为环境变量缺失时的兜底；优先级：管理面板保存(DB) > 环境变量 > 本文件 > 内置默认值
#    环境变量：CN_PROBE_URL / CN_PROBE_KEY / CN_PROBE_ENABLED
gfw:
  enabled: false                       # 境内探针总开关
  probe_url: ""                        # 探针地址，如 http://43.136.58.195:8899（不要带 /check）
  probe_key: ""                        # 探针共享密钥（X-Probe-Key 请求头）
  timeout: 3                           # 单目标 TCP 超时（秒），0.5~10
  batch_size: 100                     # 单批目标数，1~500（探针上限 500）
  check_limit: 5000                   # 单轮最多复核多少个 active 节点
  auto_check: true                    # 测速结束后自动复核
  filter_subscription: true            # 默认订阅只输出境内可达节点
  downgrade_blocked: true             # 被墙节点降级为 inactive（不硬删除）

subs_check:
  binary_path: "./subs-check"          # subs-check 二进制路径
  config_path: "./config/subs-check.yaml"
  output_dir: "./output"
  listen_port: ":8199"

sources:
  github:
    enabled: true
    refresh_interval: 3600   # 秒
  telegram:
    enabled: true
    refresh_interval: 7200

scheduler:
  fetch_cron: "0 */6 * * *"          # 每 6 小时抓取全部源
  check_cron: "0 * * * *"            # 每小时整点自动测速
  qualified_latency_ms: 200          # 节点合格延迟阈值(ms)，超过视为不合格
  auto_clean_days: 7                 # 死节点自动清理天数
